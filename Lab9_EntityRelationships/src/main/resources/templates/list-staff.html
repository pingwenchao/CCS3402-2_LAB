<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">🔙 Back to Dashboard</a>
        <span class="navbar-text text-white">PING WENCHAO - 226969</span>
    </div>
</nav>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Corporate Staff Directory</h2>
        <a th:href="@{/signup}" class="btn btn-success shadow-sm">+ Register New Staff</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department (1:N)</th>
                    <th>Assigned Projects (M:N)</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="staff : ${staffs}">
                    <td class="align-middle" th:text="${staff.id}">1</td>
                    <td class="align-middle fw-bold" th:text="${staff.name}">John Doe</td>
                    <td class="align-middle" th:text="${staff.email}">john@example.com</td>
                    <td class="align-middle" th:text="${staff.department.name}">IT</td>
                    <td class="align-middle">
                        <span th:each="project : ${staff.projects}"
                              class="badge bg-info text-dark me-1"
                              th:text="${project.name}">Project A</span>
                    </td>
                    <td class="text-center align-middle">
                        <a th:href="@{/update/{id}(id=${staff.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <a th:href="@{/delete/{id}(id=${staff.id})}" class="btn btn-sm btn-outline-danger ms-1" onclick="return confirm('Are you sure you want to delete this staff?');">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(staffs)}">
                    <td colspan="6" class="text-center text-muted py-4">No staff members found. Click "Register New Staff" to add one.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
