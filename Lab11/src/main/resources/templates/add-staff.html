<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Register New Staff</h4>
                </div>
                <div class="card-body p-4">
                    <form action="#" th:action="@{/addstaff}" th:object="${staff}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Enter full name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="Enter email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Assign Department (Select One)</label>
                            <select class="form-select" th:field="*{department}" required>
                                <option value="" disabled selected>-- Choose a Department --</option>
                                <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Assign Projects (Hold Ctrl/Cmd to select multiple)</label>
                            <select multiple class="form-select" th:field="*{projects}" style="height: 120px;" required>
                                <option th:each="proj : ${projects}" th:value="${proj.id}" th:text="${proj.name}"></option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/list}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Save Staff Record</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
