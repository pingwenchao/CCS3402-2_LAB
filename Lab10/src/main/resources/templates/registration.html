<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Corporate Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h3 class="mb-0">Registration Form</h3>
                    <small>PING WENCHAO - 226969</small>
                </div>
                <div class="card-body p-4">

                    <div th:if="${param.success}">
                        <div class="alert alert-info shadow-sm">
                            Registration successful !!!
                        </div>
                    </div>

                    <form method="post" role="form" th:action="@{/registration}" th:object="${user}">
                        <div class="mb-3">
                            <label class="form-label fw-bold" for="name">Name</label>
                            <input class="form-control" id="name" th:field="*{name}" type="text" placeholder="Enter your full name">
                            <p class="text-danger mt-1 mb-0" th:errors="*{name}" th:if="${#fields.hasErrors('name')}"></p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold" for="email">Email</label>
                            <input class="form-control" id="email" th:field="*{email}" type="email" placeholder="Enter your email address">
                            <p class="text-danger mt-1 mb-0" th:errors="*{email}" th:if="${#fields.hasErrors('email')}"></p>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold" for="password">Password</label>
                            <input class="form-control" id="password" th:field="*{password}" type="password" placeholder="Create a strong password">
                            <p class="text-danger mt-1 mb-0" th:errors="*{password}" th:if="${#fields.hasErrors('password')}"></p>
                        </div>

                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" type="submit">Register</button>
                        </div>
                        <div class="mt-3 text-center">
                            <span class="text-muted">Already have an account? </span>
                            <a class="link-primary text-decoration-none fw-bold" th:href="@{/login}">Login Here</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
