<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Corporate Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h3 class="mb-0">Secure Login Portal</h3>
                    <small>PING WENCHAO - 226969</small>
                </div>
                <div class="card-body p-4">

                    <div th:if="${param.error}">
                        <div class="alert alert-danger shadow-sm">Invalid Email or Password !!!</div>
                    </div>
                    <div th:if="${param.logout}">
                        <div class="alert alert-success shadow-sm">You have been logged out !!!</div>
                    </div>

                    <form class="form-horizontal" method="post" role="form" th:action="@{/login}">
                        <div class="mb-3">
                            <label class="form-label fw-bold" for="username">Email Address</label>
                            <input class="form-control" id="username" name="username" placeholder="Enter registered email" type="email" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold" for="password">Password</label>
                            <input class="form-control" id="password" name="password" placeholder="Enter your password" type="password" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button class="btn btn-success" type="submit">Secure Login</button>
                        </div>
                        <div class="mt-3 text-center">
                            <span class="text-muted">Don't have an account? </span>
                            <a class="link-primary text-decoration-none fw-bold" th:href="@{/registration}">Register Now</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
