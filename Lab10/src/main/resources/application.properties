spring.application.name=Lab10

# PING WENCHAO 226969
# H2 Database Credentials
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Data Initialization (Run data.sql after Hibernate creates tables)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# H2 Console Setting (Allow browser access to database)
spring.h2.console.enabled=true

# Hibernate Settings (Drop and recreate tables on every restart)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.format_sql=true